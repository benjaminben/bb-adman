# Example 1: two products shown together in one picture, in three languages and three sizes.
# Change anything here, then run `npm run quickstart` again.
# It is the same brief format the app loads with "Load a brief".
campaignName: Simple Routine
region: US and Canada
audience: Adults 20 to 35 who want a skincare routine with few steps
# The headline in the first language.
message: Skincare made simple
callToAction: Start your routine
tone: Clean, calm and friendly

# Each subject has a photo beside this file. Swap the files, or point "pictures" at others.
subjects:
  - id: treatment-bottle
    name: Treatment bottle
    description: A frosted pump bottle with a sky-blue cap and the logo in white down its side
    pictures: subject-a.png
  - id: gentle-cleanser
    name: Gentle cleanser
    description: A lilac squeeze tube that stands on its cap, with a dark logo
    pictures: subject-b.png

# The first language is the main one. One ad is made per language and size.
languages:
  - en
  - fr
  - es
sizes:
  - '1:1'
  - '4:5'
  - '9:16'

# The words for each other language. A language with no words here (es) is translated by AI.
copy:
  fr:
    headline: Le soin de la peau, en toute simplicité
    callToAction: Commencer ma routine

# The brand. "heading" is the headline's font; "body" is the font of all other text.
# Text takes the nearest of these colours.
brand:
  colours: ['#FFFFFF', '#1E2A44']
  fonts:
    heading: brand/Fraunces.woff2
    body: brand/DMSans.woff2

# Where the text sits. One of: photo-bottom-left, photo-top-centre, flat-bottom-left,
# flat-centre-top, photo-label-box.
layout: photo-top-centre

# A note for the picture, so it leaves room where the layout puts the words.
artDirection: Both products stand together in the lower half on a pale stone counter, in soft morning light. The upper third is a plain, calm wall with open space for the words.
