# The tag pipeline (spec/infra-and-settings.md, "CI pipeline"): a tag v* builds the unsigned
# installers and attaches them to a draft GitHub Release. Nothing is signed, and nothing is
# shown to the public until a person publishes the draft by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  audit:
    name: Version and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The installers are named by package.json's version, so the tag must say the same.
      - name: The tag matches the version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # On a tag an advisory at high severity fails the run (on a push it only reports).
      - run: npm audit --audit-level=high

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            builder: --mac dmg --arm64
            files: dist/*.dmg
          - name: Windows x64
            os: windows-latest
            builder: --win nsis --x64
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint and tests gate the release on macOS; the push workflow runs them on Windows too.
      - if: runner.os == 'macOS'
        run: npm run lint
      - if: runner.os == 'macOS'
        run: npm run typecheck
      - if: runner.os == 'macOS'
        run: npm test
      # The pinned FFmpeg for this system, hash and licence checked by the script itself.
      - run: npm run fetch:ffmpeg
      - run: npm run build
      - run: npm run test:build
      - run: npx electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: [audit, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Make a draft release with the installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --title "AdManager $GITHUB_REF_NAME"
          --notes "Unsigned installers for macOS (Apple silicon) and Windows (64-bit). The README explains the first launch."
